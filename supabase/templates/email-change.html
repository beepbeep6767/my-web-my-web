<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ยืนยันอีเมล Mnchat</title></head>
<body style="margin:0;background:#edf5ff;font-family:Arial,sans-serif;color:#14243d;padding:32px 16px">
<div style="max-width:480px;margin:auto;background:white;padding:32px;border-radius:20px;border-top:6px solid #5284ee">
  <h1 style="margin-top:0;color:#345bb8">Mnchat</h1>
  <h2>รหัสยืนยันอีเมลของคุณ</h2>
  <p>นำรหัสนี้ไปกรอกในหน้า Mnchat ที่คุณเปิดคำขอยืนยันไว้</p>
  <p style="font-size:36px;font-weight:bold;letter-spacing:8px;text-align:center;padding:20px;background:#eef2ff;border-radius:12px">{{ .Token }}</p>
  <p>รหัสใช้ได้ครั้งเดียว กรุณาอย่าเปิดเผยให้ผู้อื่น รวมถึงผู้ดูแลระบบ หากรหัสหมดอายุ ให้ขอรหัสใหม่จากหน้า Mnchat</p>
  <p style="font-size:13px;color:#617087">หากคุณไม่ได้ทำรายการนี้ ไม่ต้องดำเนินการใด ๆ</p>
</div></body></html>
